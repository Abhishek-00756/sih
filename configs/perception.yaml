similarity_threshold: 0.75
max_time_diff: 120.0
local_track_ttl: 8.0
detector_weights: yolov8n.pt
osnet_model: osnet_x1_0
person_class: 0
track_classes: [0, 2, 3, 5, 7]
enable_loitering: true
dwell_threshold: 30.0
enable_anpr: true
anpr_min_confidence: 0.5
anpr_min_width: 150
anpr_min_height: 150
headless: true
display: false
geofence_zones: configs/zones.json
enable_geofence: true
geofence_cooldown: 60
alert_db: border_alerts.db
snapshot_dir: alert_snapshots
geofence_camera_map:
  Cam_1_Outpost: cam_01
  Cam_2_Gate: cam_02
  Sector_Alpha: cam_01

cameras:
  Cam_1_Outpost:
    source: videos/camera1.mp4
    neighbors:
      Cam_2_Gate:
        min_transit_sec: 2.0
        max_transit_sec: 120.0
        overlapping: false
  Cam_2_Gate:
    source: videos/camera2.mp4
    neighbors:
      Cam_1_Outpost:
        min_transit_sec: 2.0
        max_transit_sec: 120.0
        overlapping: false
